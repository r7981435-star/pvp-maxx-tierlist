<!-- Popup Style -->

<style>
    /* Dark background behind the popup */
    .popup-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(4px);
        z-index: 1000;

        justify-content: center;
        align-items: center;
    }

    /* The popup window */
    .popup {
        background: #111;
        color: white;
        border: 1px solid #0091ff;
        border-radius: 12px;
        padding: 25px;
        width: 320px;
        max-width: calc(100% - 80px);
        text-align: center;
        box-shadow: 0 0 25px rgba(0, 145, 255, 0.2);
        position: relative;
        animation: popup-appear 0.2s ease;
    }

    .popup h2 {
        margin-top: 0;
        color: #0091ff;
    }

    /* Close button */
    .popup-close {
        position: absolute;
        top: 8px;
        right: 12px;
        background: none;
        border: none;
        color: #888;
        font-size: 24px;
        cursor: pointer;
    }

    .popup-close:hover {
        color: white;
    }

    @keyframes popup-appear {
        from {
            opacity: 0;
            transform: scale(0.9);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }
</style>
